<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ravana City Roleplay — Login</title>

  <!-- INTERNAL STYLES (3D / GTA inspired) -->
  <style>
    :root{
      --bg1:#0f0a04;
      --bg2:#1a1206;
      --neon1:#ffd54f;
      --neon2:#ffb300;
      --accent:#ffb300;
      --glass: rgba(255,255,255,0.04);
      --muted: #9aa4b2;
      --card-w: 420px;
      --ease: cubic-bezier(.2,.9,.2,1);
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }

    html,body{
      height:100%;
      margin:0;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(255,213,79,0.03), transparent),
                  linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 100%);
      color:#e8f6ee;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow:hidden;
    }

    /* Neon horizon + subtle grain */
    .scene {
      position:fixed; inset:0; z-index:0;
      perspective: 1100px;
      transform-style: preserve-3d;
      pointer-events:none;
    }

    /* SVG skyline container */
    .skyline {
      position:absolute;
      left:50%;
      bottom:-10%;
      transform: translateX(-50%) translateZ(-200px) scale(1.6);
      opacity:0.95;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
    }

    /* atmospheric fog / gradient */
    .haze{
      position:absolute;
      inset:0;
      background: linear-gradient(180deg, rgba(10,10,18,0.0) 0%, rgba(10,10,18,0.38) 60%, rgba(2,4,7,0.9) 100%);
      mix-blend-mode: multiply;
      pointer-events:none;
    }

    /* subtle moving lights */
    .light-strip{
      position:absolute; left:0; right:0; top:40%;
      height:200px; background: linear-gradient(90deg, transparent, rgba(255,179,0,0.04), transparent);
      transform: translateZ(0);
      animation: slide 12s linear infinite;
      pointer-events:none;
    }
    @keyframes slide { 0%{transform:translateX(-30%)} 100%{transform:translateX(30%)} }

    /* centered app area */
    .wrap{
      position:relative;
      z-index:5;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
      box-sizing:border-box;
    }

    /* floating 3D card */
    .card {
      width: var(--card-w);
      max-width: calc(100% - 40px);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border-radius:16px;
      padding:22px;
      box-shadow: 0 30px 80px rgba(2,6,23,0.75), 0 6px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.04);
      transform-style: preserve-3d;
      transition: transform 300ms var(--ease), box-shadow 300ms var(--ease);
      will-change: transform;
      backdrop-filter: blur(8px) saturate(120%);
      overflow:hidden;
    }

    /* neon top strip */
    .neon-top {
      position:absolute; left:0; right:0; top:0; height:6px;
      background: linear-gradient(90deg, rgba(255,213,79,0.9), rgba(255,179,0,0.9));
      box-shadow: 0 6px 26px rgba(255,213,79,0.06);
      border-top-left-radius:12px; border-top-right-radius:12px;
      transform: translateZ(80px);
    }

    .brand {
      display:flex; gap:12px; align-items:center; margin-bottom:8px; transform: translateZ(60px);
    }
    .logo {
      width:48px;height:48px;border-radius:10px;
      background: linear-gradient(135deg, var(--neon1), var(--neon2));
      display:flex;align-items:center;justify-content:center;color:#02110a;font-weight:800;
      box-shadow: 0 12px 40px rgba(255,179,0,0.08), 0 4px 14px rgba(0,0,0,0.6);
      font-family: "Orbitron", sans-serif;
      font-size:18px;
    }
    .brand h1{
      font-size:18px;margin:0; letter-spacing:1px; transform: translateZ(60px);
    }
    .brand p{ margin:0; font-size:12px; color:var(--muted); transform: translateZ(60px); }

    /* hero neon title */
    .title {
      text-align:center;
      margin:14px 0 18px;
      font-family: "Orbitron", sans-serif;
      letter-spacing:2px;
      font-size:20px;
      color: #e9fff6;
      text-shadow:
        0 2px 0 rgba(0,0,0,0.6),
        0 6px 18px rgba(255,213,79,0.06),
        0 0 12px rgba(255,179,0,0.06);
      transform: translateZ(40px);
    }

    /* forms layout */
    .forms { display:flex; gap:12px; align-items:stretch; justify-content:center; transform: translateZ(40px); }
    .panel { flex:1; padding:12px; border-radius:10px; background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.02) }

    label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px }
    input[type="text"], input[type="password"], input[type="email"] {
      width:100%;
      padding:11px 12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.04);
      background: rgba(0,0,0,0.25);
      color: #eafdf4;
      outline:none;
      font-size:14px;
      transition: box-shadow .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
    }
    input:focus {
      box-shadow: 0 8px 28px rgba(255,179,0,0.06);
      border-color: rgba(255,213,79,0.28);
      transform: translateY(-2px);
    }

    .btn {
      display:inline-block;
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      background: linear-gradient(90deg, var(--neon1), var(--neon2));
      color:#02110a;
      font-weight:700;
      letter-spacing:0.6px;
      box-shadow: 0 14px 40px rgba(255,179,0,0.06);
      transition: transform .18s var(--ease), box-shadow .18s var(--ease);
      margin-top:8px;
    }
    .btn:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 22px 60px rgba(255,179,0,0.08); }

    .muted { font-size:13px; color:var(--muted); text-align:center; margin-top:10px; }

    .linkish { color:var(--neon2); cursor:pointer; text-decoration:underline; font-weight:600; display:inline-block }

    /* small footer strip */
    .footer {
      margin-top:12px;
      font-size:12px;
      color:var(--muted);
      text-align:center;
    }

    /* loading overlay */
    #loading {
      position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
      background: radial-gradient(800px 400px at 50% 35%, rgba(255,179,0,0.06), rgba(2,4,7,0.85));
      opacity:0; pointer-events:none; transition:opacity .28s ease;
    }
    #loading.show { opacity:1; pointer-events:auto; }
    .loader {
      width:120px; height:120px; border-radius:50%;
      background: conic-gradient(rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 40px 140px rgba(2,6,23,0.7);
    }
    .ring {
      width:64px; height:64px; border-radius:50%;
      border:6px solid rgba(0,0,0,0.12);
      border-top-color:var(--neon1);
      animation: spin 1s linear infinite;
    }
    .loading-text { margin-top:12px; color:#dfffe9; font-weight:700; letter-spacing:0.6px; text-align:center }

    /* tilt shadow */
    .card::before {
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.01));
      pointer-events:none;
      mix-blend-mode: screen;
      transform: translateZ(30px);
    }

    /* responsive */
    @media (max-width:780px){
      :root{ --card-w: 92vw; }
      .forms { flex-direction:column; }
    }
  </style>
</head>
<body>

  <!-- Scene background -->
  <div class="scene" aria-hidden="true">
    <!-- moving light -->
    <div class="light-strip"></div>

    <!-- skyline SVG (stylized simple blocks) -->
    <svg class="skyline" width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="g1" x1="0" x2="1">
          <stop offset="0" stop-color="#001b18" stop-opacity="1"/>
          <stop offset="1" stop-color="#00282b" stop-opacity="1"/>
        </linearGradient>
        <linearGradient id="light" x1="0" x2="1">
              <stop offset="0" stop-color="#ffd54f" stop-opacity="0.06"/>
              <stop offset="1" stop-color="#ffb300" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      <rect x="0" y="80" width="1200" height="140" fill="url(#g1)"/>
      <!-- buildings -->
      <rect x="28" y="30" width="60" height="190" fill="#071f2a" />
      <rect x="120" y="80" width="48" height="140" fill="#081926"/>
      <rect x="186" y="20" width="86" height="200" fill="#0b2130"/>
      <rect x="290" y="110" width="40" height="110" fill="#071826"/>
      <rect x="342" y="58" width="120" height="162" fill="#08212b"/>
      <rect x="480" y="30" width="76" height="190" fill="#051418"/>
      <rect x="576" y="88" width="58" height="132" fill="#081a22"/>
      <rect x="650" y="24" width="120" height="196" fill="#07212b"/>
      <rect x="788" y="96" width="44" height="124" fill="#062026"/>
      <rect x="840" y="42" width="100" height="178" fill="#05202a"/>
      <rect x="960" y="10" width="140" height="210" fill="#081b26"/>
      <rect x="1110" y="80" width="40" height="140" fill="#08131a"/>
      <!-- skyline light glow -->
      <rect x="0" y="40" width="1200" height="180" fill="url(#light)" opacity="0.06"/>
    </svg>

    <div class="haze"></div>
  </div>

  <!-- Loading overlay -->
  <div id="loading" role="status" aria-live="polite" aria-hidden="true">
    <div>
      <div class="loader" aria-hidden="true">
        <div class="ring" aria-hidden="true"></div>
      </div>
      <div class="loading-text">Connecting to Ravana City Network...</div>
    </div>
  </div>

  <!-- App -->
  <div class="wrap" id="app">
    <div class="card" id="card" aria-labelledby="title">
      <div class="neon-top" aria-hidden="true"></div>

      <div class="brand" role="banner">
        <div class="logo">DR</div>
        <div>
          <h1>RAVANA CITY ROLEPLAY V4</h1>
          <p>Enter Los Santos • Live your story</p>
        </div>
      </div>

      <div class="title" id="title">WELCOME — LOGIN / REGISTER</div>

      <div class="forms" role="region" aria-label="authentication forms">
        <!-- LOGIN panel -->
        <div class="panel" id="loginPanel">
          <label for="loginUser">Username or Email</label>
          <input id="loginUser" type="text" placeholder="e.g. Xenzo_DEV" autocomplete="username">

          <label for="loginPass" style="margin-top:10px">Password</label>
          <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">

          <button class="btn" id="loginBtn">LOGIN</button>

          <div class="muted">No account? <span class="linkish" id="showReg">Register</span></div>
        </div>

        <!-- REGISTER panel -->
        <div class="panel" id="regPanel" style="display:none;">
          <label for="regUser">Choose Username</label>
          <input id="regUser" type="text" placeholder="Joni_Sins">

          <label for="regEmail" style="margin-top:10px">Email</label>
          <input id="regEmail" type="email" placeholder="you@example.com" autocomplete="email">

          <label for="regPass" style="margin-top:10px">Password</label>
          <input id="regPass" type="password" placeholder="Minimum 6 characters" autocomplete="new-password">

          <label for="regCode" style="margin-top:10px">Admin Code (optional)</label>
          <input id="regCode" type="text" placeholder="Enter admin code to register as admin">

          <button class="btn" id="regBtn">REGISTER</button>

          <div class="muted">Already registered? <span class="linkish" id="showLogin">Sign in</span></div>
        </div>
      </div>

      <div class="footer">© Ravana City RolePlay 2026 • By YEAM 999</div>
    </div>
  </div>

  <!-- INTERNAL JS (tilt, toggle, storage, loading + redirect) -->
  <script>
    // Elements
    const card = document.getElementById('card');
    const loading = document.getElementById('loading');
    const loginPanel = document.getElementById('loginPanel');
    const regPanel = document.getElementById('regPanel');
    const showReg = document.getElementById('showReg');
    const showLogin = document.getElementById('showLogin');
    const loginBtn = document.getElementById('loginBtn');
    const regBtn = document.getElementById('regBtn');

    // -------------- 3D tilt effect on mouse move --------------
    const strength = 18; // tilt strength
    document.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const px = dx / rect.width;
      const py = dy / rect.height;
      const rx = (-py * strength).toFixed(2);
      const ry = (px * strength).toFixed(2);
      card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(0)`;
    });

    // reset tilt when mouse leaves viewport/card
    document.addEventListener('mouseleave', () => card.style.transform = 'rotateX(0deg) rotateY(0deg)');

    // -------------- Toggle panels --------------
    showReg.addEventListener('click', () => {
      loginPanel.style.display = 'none';
      regPanel.style.display = 'block';
      // small pulse
      card.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.01)' }, { transform: 'scale(1)' }], {duration:260, easing:'ease-out'});
    });
    showLogin.addEventListener('click', () => {
      regPanel.style.display = 'none';
      loginPanel.style.display = 'block';
      card.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.01)' }, { transform: 'scale(1)' }], {duration:260, easing:'ease-out'});
    });

    // -------------- simple localStorage mock (demo only) --------------
    function loadUsers(){
      try { return JSON.parse(localStorage.getItem('deadend_users') || '{}'); }
      catch(e){ return {}; }
    }
    function saveUsers(u){ localStorage.setItem('deadend_users', JSON.stringify(u)); }

    // Register
    regBtn.addEventListener('click', async () => {
      const name = document.getElementById('regUser').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const pass = document.getElementById('regPass').value;
      const code = (document.getElementById('regCode') && document.getElementById('regCode').value.trim()) || '';

      if(!name || !email || pass.length < 6){
        alert('Please complete fields. Password must be at least 6 characters.');
        return;
      }
      const users = loadUsers();
      for(const k in users){
        if(users[k].username.toLowerCase() === name.toLowerCase() || users[k].email === email){
          alert('User or email already exists.');
          return;
        }
      }
      const id = 'u' + Date.now();
      users[id] = { id, username: name, email, password: pass, isAdmin: (code === 'TEAM999@#') };
      saveUsers(users);

      // If admin code supplied, create a local admin token and redirect to admin panel
      if(code === 'TEAM999@#'){
        // create a simple client-side admin token and mark as local admin
        try{
          const t = 'local-' + Math.random().toString(36).slice(2);
          localStorage.setItem('rc_admin_token', t);
          localStorage.setItem('rc_admin_local', 'true');
          // ensure any previous local override exists
          if(!localStorage.getItem('rc_local_override')) localStorage.setItem('rc_local_override', JSON.stringify(null));
          // redirect to admin panel (HTML-only flow)
          window.location.href = 'admin.html';
          return;
        }catch(e){
          alert('Failed to create local admin token. Proceeding with normal registration.');
          showLoadingAndRedirect();
          return;
        }
      }

      // show loader + redirect (normal user)
      showLoadingAndRedirect();
    });

    // Login
    loginBtn.addEventListener('click', () => {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value;
      if(!u || !p){ alert('Fill username/email and password'); return; }

      const users = loadUsers();
      let found = null;
      for(const k in users){
        const x = users[k];
        if(x.username.toLowerCase() === u.toLowerCase() || x.email === u.toLowerCase()){
          found = x; break;
        }
      }
      if(!found || found.password !== p){
        alert('Invalid credentials (demo localStorage).');
        return;
      }

      // store session
      localStorage.setItem('deadend_session', JSON.stringify({ id: found.id, username: found.username, loggedAt: Date.now() }));
      // If this user was registered as admin, ensure a local admin token and go to admin panel
      if(found.isAdmin){
        if(!localStorage.getItem('rc_admin_token')){
          const t = 'local-' + Math.random().toString(36).slice(2);
          localStorage.setItem('rc_admin_token', t);
        }
        localStorage.setItem('rc_admin_local', 'true');
        if(!localStorage.getItem('rc_local_override')) localStorage.setItem('rc_local_override', JSON.stringify(null));
        window.location.href = 'admin.html';
        return;
      }
      // normal user -> dashboard
      showLoadingAndRedirect();
    });

    // Guest quick play
    // allow quick double-tap on logo -> guest login
    document.querySelector('.logo').addEventListener('dblclick', () => {
      localStorage.setItem('deadend_session', JSON.stringify({ id: 'guest', username: 'Guest', loggedAt: Date.now() }));
      showLoadingAndRedirect();
    });

    // -------------- Loading + Redirect --------------
    function showLoadingAndRedirect(){
      loading.classList.add('show');
      loading.setAttribute('aria-hidden','false');
      // simulate network connect: check server (demo) then redirect
      setTimeout(() => {
        // redirect to dashboard.html (same folder)
        window.location.href = 'dashboard.html';
      }, 1600);
    }

    // Hide loading initially
    window.addEventListener('load', () => {
      // small entrance animation for card
      card.style.transform = 'translateY(8px)';
      card.animate([{ opacity:0, transform:'translateY(12px) translateZ(0) scale(.995)' }, { opacity:1, transform:'translateY(0) translateZ(0)' }], { duration:420, easing:'ease-out' });
    });

    // Accessibility: Enter to submit
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        if(getComputedStyle(regPanel).display !== 'none'){
          regBtn.click();
        } else {
          loginBtn.click();
        }
      }
    });
  </script>
</body>
</html>
